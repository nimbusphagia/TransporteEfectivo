<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Administrar reportes')}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="contenedor pagina">
      <div th:replace="~{fragments/layout :: mensajes}"></div>

      <h1 class="titulo-pagina">Reportes de pasajeros</h1>

      <form class="formulario seccion" th:action="@{/admin/reportes}" method="get">
        <div class="campo">
          <label for="tipo">Tipo</label>
          <select id="tipo" class="input" name="tipo">
            <option value="">Todos los tipos</option>
            <option
              th:each="tipo : ${tipos}"
              th:value="${tipo}"
              th:text="${tipo}"
              th:selected="${tipo == tipoSeleccionado}"
            >QUEJA</option>
          </select>
        </div>

        <div class="campo">
          <label for="lineaId">Línea</label>
          <select id="lineaId" class="input" name="lineaId">
            <option value="">Todas las líneas</option>
            <option
              th:each="linea : ${lineas}"
              th:value="${linea.id}"
              th:text="${linea.nombre}"
              th:selected="${linea.id == lineaSeleccionada}"
            >Línea Azul</option>
          </select>
        </div>

        <div class="campo">
          <label for="estado">Estado</label>
          <select id="estado" class="input" name="estado">
            <option value="">Todos los estados</option>
            <option
              th:each="estado : ${estados}"
              th:value="${estado}"
              th:text="${estado}"
              th:selected="${estado == estadoSeleccionado}"
            >PENDIENTE</option>
          </select>
        </div>

        <div class="fila">
          <button class="btn btn--principal" type="submit">Filtrar</button>
          <a class="btn btn--secundario" th:href="@{/admin/reportes}">Limpiar filtros</a>
        </div>
      </form>

      <div class="vacio seccion" th:if="${#lists.isEmpty(reportes)}">
        <h2 class="vacio__titulo">No hay reportes para mostrar</h2>
        <p>Prueba con otros filtros o vuelve a consultar más adelante.</p>
      </div>

      <div class="tabla-contenedor seccion" th:unless="${#lists.isEmpty(reportes)}">
        <table class="tabla">
          <thead>
            <tr>
              <th scope="col">Pasajero</th>
              <th scope="col">Tipo</th>
              <th scope="col">Línea</th>
              <th scope="col">Comentario</th>
              <th scope="col">Estado</th>
              <th scope="col">Fecha</th>
              <th scope="col">Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="reporte : ${reportes}">
              <td th:text="${reporte.usuario.nombreCompleto}">Ana Torres</td>
              <td th:text="${reporte.tipo}">QUEJA</td>
              <td th:text="${reporte.linea.nombre}">Línea Azul</td>
              <td th:text="${reporte.comentario}">Comentario del pasajero</td>
              <td>
                <span
                  class="etiqueta"
                  th:classappend="${reporte.estado.name() == 'PENDIENTE'} ? ' etiqueta--aviso' : ' etiqueta--exito'"
                  th:text="${reporte.estado}"
                >PENDIENTE</span>
              </td>
              <td th:text="${#temporals.format(reporte.createdAt, 'dd/MM/yyyy HH:mm')}">
                18/10/2026 12:00
              </td>
              <td class="tabla__acciones">
                <form
                  th:if="${reporte.estado.name() == 'PENDIENTE'}"
                  th:action="@{/admin/reportes/{id}/revisar(id=${reporte.id})}"
                  method="post"
                >
                  <button class="btn btn--texto btn--peque" type="submit">Marcar revisado</button>
                </form>
                <span class="texto-secundario" th:if="${reporte.estado.name() == 'REVISADA'}">
                  Sin acciones
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>

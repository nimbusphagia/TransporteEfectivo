<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head(${titulo})}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="contenedor pagina pagina-error">
      <p class="pagina-error__codigo" th:text="${status}">500</p>
      <h1 class="titulo-pagina" th:text="${titulo}">Error</h1>
      <p class="texto-secundario" th:text="${mensaje}">Mensaje</p>
      <a class="btn btn--principal" th:href="@{/}">Volver al inicio</a>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>

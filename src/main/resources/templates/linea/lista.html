<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Líneas')}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="contenedor pagina">
      <div th:replace="~{fragments/layout :: mensajes}"></div>

      <h1 class="titulo-pagina">Líneas de transporte</h1>
      <p class="texto-secundario">
        Elige una línea para ver su itinerario y los paraderos por los que pasa.
      </p>

      <section class="seccion">
        <div class="cuadricula cuadricula-lineas" th:if="${!#lists.isEmpty(lineas)}">
          <a
            class="tarjeta tarjeta--enlace tarjeta-linea"
            th:each="l : ${lineas}"
            th:href="@{/lineas/{id}/paraderos(id=${l.id})}"
          >
            <div class="tarjeta__cuerpo">
              <h2 class="tarjeta__titulo" th:text="${l.nombre}">Línea Azul</h2>
              <p
                class="tarjeta__detalle"
                th:text="'S/ ' + ${#numbers.formatDecimal(l.costoPasaje, 1, 'NONE', 2, 'POINT')} + ' por viaje'"
              >
                S/ 1.50 por viaje
              </p>
              <span class="tarjeta-linea__enlace">Ver itinerario</span>
            </div>
            <img
              class="tarjeta__imagen"
              th:src="@{${imagenesPorLinea[l.id]}}"
              th:alt="${l.nombre}"
            />
          </a>
        </div>

        <div class="vacio" th:if="${#lists.isEmpty(lineas)}">
          <p class="vacio__titulo">Aún no hay líneas</p>
          <p>Cuando el administrador las agregue, aparecerán aquí.</p>
        </div>
      </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>

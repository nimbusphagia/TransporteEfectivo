<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head(${'Itinerario de ' + linea.nombre})}"></head>
  <body>
    <header th:replace="~{fragments/layout :: header}"></header>

    <main class="contenedor pagina">
      <div th:replace="~{fragments/layout :: mensajes}"></div>

      <div class="fila fila--entre">
        <div>
          <h1 class="titulo-pagina" th:text="${linea.nombre}">Línea Azul</h1>
          <p
            class="texto-secundario"
            th:text="'Pasaje: S/ ' + ${#numbers.formatDecimal(linea.costoPasaje, 1, 'NONE', 2, 'POINT')} + ' por viaje'"
          >
            Pasaje: S/ 1.50 por viaje
          </p>
        </div>
        <a class="btn btn--secundario" th:href="@{/lineas}">← Volver a líneas</a>
      </div>

      <section class="seccion">
        <h2 class="titulo-seccion">Itinerario</h2>
        <p class="texto-secundario texto-pequeno">
          Paraderos en el orden en que la línea los recorre.
        </p>

        <div class="tabla-contenedor" th:if="${!#lists.isEmpty(paraderos)}">
          <table class="tabla">
            <thead>
              <tr>
                <th>N.º</th>
                <th>Paradero</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="p : ${paraderos}">
                <td><span class="etiqueta" th:text="${p.orden}">1</span></td>
                <td th:text="${p.nombre}">Av. Arequipa</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="vacio" th:if="${#lists.isEmpty(paraderos)}">
          <p class="vacio__titulo">Sin paraderos registrados</p>
          <p>Esta línea todavía no tiene paraderos cargados.</p>
        </div>
      </section>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
  </body>
</html>

<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ingresar')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="contenedor pagina">
  <div th:replace="~{fragments/layout :: mensajes}"></div>
  <h1 class="titulo-pagina">Iniciar sesión</h1>
  <p class="texto-secundario">Ingresa con el correo y la contraseña de tu cuenta.</p>
  <div class="mensaje mensaje--error" role="alert" th:if="${param.error}">
    Correo o contraseña incorrectos, o cuenta desactivada.
  </div>
  <div class="mensaje mensaje--exito" role="status" th:if="${param.logout}">
    Cerraste sesión correctamente.
  </div>
  <form class="formulario" th:action="@{/login}" method="post">
    <div class="campo">
      <label for="correo">Correo electrónico</label>
      <input class="input" type="email" id="correo" name="correo" autocomplete="username" required maxlength="100" />
    </div>
    <div class="campo">
      <label for="password">Contraseña</label>
      <input class="input" type="password" id="password" name="password" autocomplete="current-password" required />
    </div>
    <button class="btn btn--principal" type="submit">Ingresar</button>
  </form>
  <p class="seccion">¿No tienes una cuenta? <a th:href="@{/registro}">Regístrate aquí</a>.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>

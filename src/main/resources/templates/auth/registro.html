<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="contenedor pagina">
  <div th:replace="~{fragments/layout :: mensajes}"></div>
  <h1 class="titulo-pagina">Crear cuenta de pasajero</h1>
  <p class="texto-secundario">Completa tus datos para consultar tus reportes.</p>
  <form class="formulario" th:action="@{/registro}" th:object="${registro}" method="post">
    <div class="campo">
      <label for="nombreCompleto">Nombre completo</label>
      <input class="input" id="nombreCompleto" th:field="*{nombreCompleto}" maxlength="150"
             th:classappend="${#fields.hasErrors('nombreCompleto')} ? 'input--error'" autocomplete="name" required />
      <p class="campo__error" th:if="${#fields.hasErrors('nombreCompleto')}" th:errors="*{nombreCompleto}"></p>
    </div>
    <div class="campo">
      <label for="dni">DNI</label>
      <input class="input" id="dni" th:field="*{dni}" inputmode="numeric" pattern="[0-9]{8}" maxlength="8"
             th:classappend="${#fields.hasErrors('dni')} ? 'input--error'" required />
      <p class="campo__error" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></p>
    </div>
    <div class="campo">
      <label for="correo">Correo electrónico</label>
      <input class="input" id="correo" type="email" th:field="*{correo}" maxlength="100"
             th:classappend="${#fields.hasErrors('correo')} ? 'input--error'" autocomplete="email" required />
      <p class="campo__error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></p>
    </div>
    <div class="campo">
      <label for="password">Contraseña</label>
      <input class="input" id="password" type="password" name="password" minlength="8" maxlength="72"
             th:classappend="${#fields.hasErrors('password')} ? 'input--error'" autocomplete="new-password" required />
      <p class="campo__ayuda">Utiliza entre 8 y 72 caracteres.</p>
      <p class="campo__error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
    </div>
    <div class="campo">
      <label for="confirmarPassword">Confirmar contraseña</label>
      <input class="input" id="confirmarPassword" type="password" name="confirmarPassword"
             th:classappend="${#fields.hasErrors('confirmarPassword')} ? 'input--error'" autocomplete="new-password" required />
      <p class="campo__error" th:if="${#fields.hasErrors('confirmarPassword')}" th:errors="*{confirmarPassword}"></p>
    </div>
    <button class="btn btn--principal" type="submit">Registrarme</button>
  </form>
  <p class="seccion">¿Ya tienes una cuenta? <a th:href="@{/login}">Ingresa aquí</a>.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
